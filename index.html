<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي الشخصي | MIDO</title>
  <style>
    :root {
      --bg-color: #f7f9fb;
      --card-bg: #ffffff;
      --primary-color: #3b6978;
      --accent-color: #204051;
      --text-main: #2d3748;
      --text-muted: #718096;
      --border-color: #e2e8f0;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.7;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    header p {
      margin: 8px 0 0;
      color: #e4eef2;
      font-size: 1rem;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .post-title {
      margin-top: 0;
      margin-bottom: 8px;
      color: var(--accent-color);
      font-size: 1.3rem;
    }

    .post-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .post-content {
      font-size: 1rem;
      color: var(--text-main);
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>مرحباً بك في موقعي</h1>
    <p>مساحتي الخاصة لمشاركة الأفكار والمنشورات</p>
  </header>

  <main class="container">

    <article class="post-card">
      <h2 class="post-title">منشور جديد</h2>
      <div class="post-date">تاريخ النشر: اليوم</div>
      <div class="post-content">
        <p>أهلاً بكم في موقعي على GitHub! تم تصميم هذا الموقع بألوان هادئة ومريحة وتصميم متناسق مع شاشات الهواتف.</p>
      </div>
    </article>

  </main>

  <footer>
    <p>© جميع الحقوق محفوظة لـ MIDO</p>
  </footer>

</body>
</html>
