<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي الشخصي | MIDO</title>
  <style>
    :root {
      --bg-color: #f7f9fb;
      --card-bg: #ffffff;
      --primary-color: #3b6978;
      --accent-color: #204051;
      --text-main: #2d3748;
      --text-muted: #718096;
      --border-color: #e2e8f0;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.7;
    }
    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 35px 20px;
    }
    header h1 {
      margin: 0;
      font-size: 1.8rem;
    }
    header p {
      margin: 8px 0 0;
      color: #e4eef2;
      font-size: 1rem;
    }
    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 0 15px;
    }
    .app-link-card {
      display: block;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      margin-bottom: 20px;
    }
    .app-link-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
    }
    .app-icon {
      width: 95px;
      height: 95px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 12px;
      object-fit: cover;
    }
    .app-title {
      margin: 0;
      color: var(--accent-color);
      font-size: 1.35rem;
    }
    .click-hint {
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--primary-color);
      font-weight: bold;
    }
    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    footer {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>مرحباً بك في موقعي</h1>
    <p>مساحتي الخاصة لمشاركة التطبيقات والمنشورات</p>
  </header>

  <main class="container">

    <!-- بطاقة التطبيق القابلة للنقر -->
    <a href="modi.html" class="app-link-card">
      <img src="icon.png" alt="أيقونة تطبيق MODI" class="app-icon">
      <h2 class="app-title">📱 تطبيق MODI</h2>
      <p style="margin: 6px 0 0 0; color: var(--text-muted); font-size: 0.95rem;">مسجل وحاسبة نقاط الشدة والدومينو</p>
      <div class="click-hint">اضغط هنا لمعرفة التفاصيل وتحميل التطبيق ←</div>
    </a>

    <!-- بطاقة منشور عادي -->
    <article class="post-card">
      <h3 style="margin-top:0; color: var(--accent-color);">منشور جديد</h3>
      <p style="margin-bottom:0; color: var(--text-main);">أهلاً بكم في موقعي! تم تصميم الواجهة لتكون سريعة وسهلة التصفح من الهاتف.</p>
    </article>

  </main>

  <footer>
    <p>© جميع الحقوق محفوظة لـ MIDO</p>
  </footer>

</body>
</html>
